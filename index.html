<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#4F46E5">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="MemoBam">
  <title>MemoBam — Sola Lettura</title>
  <link rel="manifest" href="./manifest.json">
  <link rel="icon" type="image/svg+xml" href="./icons/icon.svg">
  <link rel="apple-touch-icon" href="./icons/icon-192.png">
  <link rel="stylesheet" href="./css/styles.css">
</head>
<body>
  <div class="app-shell">
    <!-- Top Header -->
    <header class="topbar">
      <div class="topbar-brand">
        <img src="./icons/icon.svg" alt="MemoBam" class="brand-icon">
        <div>
          <div class="brand-title-row">
            <h1 class="brand-title">MemoBam</h1>
            <span class="readonly-pill" title="Applicazione in sola lettura">SOLA LETTURA</span>
          </div>
          <span id="storageBadge" class="storage-badge" title="Origine dati attiva">Cache Locale</span>
        </div>
      </div>

      <div class="topbar-controls">
        <div class="search-box">
          <span class="search-icon" aria-hidden="true">🔍</span>
          <input id="searchInput" type="search" placeholder="Cerca titolo, file, note, diario..." autocomplete="off">
          <button id="clearSearchBtn" class="icon-btn hidden" title="Pulisci ricerca" aria-label="Pulisci ricerca">✕</button>
        </div>

        <div class="date-filter-box">
          <input id="dateFilterInput" type="date" title="Filtra per giorno">
          <button id="clearDateBtn" class="icon-btn hidden" title="Mostra tutte le date" aria-label="Mostra tutte le date">✕</button>
        </div>

        <label class="toggle-chip desktop-only" title="Mostra solo gli elementi ancora da terminare">
          <input id="onlyPendingChk" type="checkbox">
          <span>Solo in sospeso</span>
        </label>

        <button id="connectFolderBtn" class="btn btn-secondary desktop-only" title="Collega cartella MemoBam in sola lettura (ChromeOS / Desktop)">
          📁 <span id="connectFolderLabel">Collega Cartella</span>
        </button>

        <button id="installBtn" class="btn btn-primary hidden" title="Installa come App">
          📲 Installa
        </button>

        <button id="themeToggleBtn" class="icon-btn theme-btn" title="Cambia tema Chiaro/Scuro" aria-label="Cambia tema">
          🌙
        </button>

        <button id="settingsOpenBtn" class="icon-btn desktop-only" title="Carica dati JSON / Impostazioni" aria-label="Carica dati e impostazioni">
          ⚙️
        </button>
      </div>
    </header>

    <!-- Pending Alerts Banner ("Da terminare") -->
    <section id="pendingBanner" class="pending-banner hidden" aria-live="polite">
      <div class="pending-header">
        <button id="pendingToggleBtn" class="pending-toggle" type="button">
          <span class="pending-dot"></span>
          <strong>Da terminare: <span id="pendingCount">0</span></strong>
          <span id="pendingChevron" class="chevron">▾</span>
        </button>
      </div>
      <div id="pendingList" class="pending-list"></div>
    </section>

    <!-- Main Workspace (Split on ChromeOS/Tablet, Tabbed on Mobile) -->
    <main class="workspace">
      <!-- ARCHIVE PANE (READ-ONLY) -->
      <section id="archivePane" class="pane active" data-pane="archive">
        <div class="pane-header">
          <div class="pane-title-group">
            <h2>📦 Archivio Documenti</h2>
            <span id="archiveCountBadge" class="count-pill">0</span>
          </div>
          <label class="toggle-chip" title="Nascondi gli allegati del diario dall'archivio">
            <input id="excludeDiaryAttachmentsChk" type="checkbox">
            <span>Escludi allegati diario</span>
          </label>
        </div>

        <div id="archiveList" class="card-list"></div>
      </section>

      <!-- DIARY PANE (READ-ONLY) -->
      <section id="diaryPane" class="pane" data-pane="diary">
        <div class="pane-header">
          <div class="pane-title-group">
            <h2>📓 Diario Giornaliero</h2>
            <span id="diaryCountBadge" class="count-pill">0</span>
          </div>
          <div class="pane-actions">
            <label class="toggle-chip mobile-only-inline">
              <input id="onlyPendingMobileChk" type="checkbox">
              <span>In sospeso</span>
            </label>
          </div>
        </div>

        <div id="diaryList" class="card-list"></div>
      </section>

      <!-- MOBILE DATA / SETTINGS PANE -->
      <section id="settingsPane" class="pane mobile-only-pane" data-pane="settings">
        <div class="pane-header">
          <h2>⚙️ Carica Dati & Opzioni</h2>
        </div>
        <div id="settingsContentMobile" class="settings-stack"></div>
      </section>
    </main>

    <!-- Mobile Bottom Navigation -->
    <nav class="bottom-nav" aria-label="Navigazione principale">
      <button class="nav-btn active" data-tab="archive" type="button">
        <span class="nav-ico">📦</span>
        <span>Archivio</span>
      </button>
      <button class="nav-btn" data-tab="diary" type="button">
        <span class="nav-ico">📓</span>
        <span>Diario</span>
      </button>
      <button class="nav-btn" data-tab="pending" type="button">
        <span class="nav-ico">⏳</span>
        <span>In sospeso</span>
        <span id="navPendingBadge" class="nav-badge hidden">0</span>
      </button>
      <button class="nav-btn" data-tab="settings" type="button">
        <span class="nav-ico">⚙️</span>
        <span>Dati</span>
      </button>
    </nav>
  </div>

  <!-- Settings / Import Modal (Desktop / ChromeOS) -->
  <div id="settingsModal" class="modal-backdrop hidden" role="dialog" aria-modal="true" aria-labelledby="settingsModalTitle">
    <div class="modal-card">
      <div class="modal-header">
        <h3 id="settingsModalTitle">⚙️ Carica Dati (Sola Lettura)</h3>
        <button id="closeSettingsModalBtn" class="icon-btn" aria-label="Chiudi">✕</button>
      </div>
      <div id="settingsContentModal" class="modal-body settings-stack"></div>
    </div>
  </div>

  <!-- Toast Notification -->
  <div id="toast" class="toast hidden" role="status" aria-live="polite"></div>

  <script type="module" src="./js/app.js"></script>
</body>
</html>
